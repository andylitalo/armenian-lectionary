name: CI

# Runs on every push so PRs get a status check before merging (see repo
# settings note below -- a required-status-check rule on `main` is what
# actually blocks the merge; this workflow just produces the check).
#
# Note: the accuracy-lock tests that need dev/reference_data/ (git-ignored,
# ~39 MB scraped cache) SKIP automatically on a fresh checkout -- see
# tests/_reference_cache.py. CI therefore covers everything except that cache.

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install web-layer dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite
        run: python -m unittest discover -s tests -t .
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
